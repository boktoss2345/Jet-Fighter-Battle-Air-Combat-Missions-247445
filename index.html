<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="theme-color" content="#10101b">
  <title>Opening Toca Boca Life Farm</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #10101b;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    main { max-width: 420px; }
    h1 { font-size: 28px; }
    p { color: #c9c9db; line-height: 1.6; }
    a {
      display: inline-block;
      margin-top: 12px;
      padding: 15px 26px;
      border-radius: 12px;
      background: #7048eb;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }
    a:focus-visible {
      outline: 3px solid #ffd54f;
      outline-offset: 4px;
    }

<body>
  <main>
    <h1>Toca Boca Life Farm</h1>

    </a>

  <script>
    window.location.replace('https://www.madkidgames.com/full/toca-boca-life-farm');
